name: Neovim Config CI

on:
  push:
    branches: ["main", "lazy", "packer"]
  pull_request:
    branches: ["main", "lazy", "packer"]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal
          components: rustfmt

      - name: Install stylua
        run: cargo install stylua

      - name: Format Lua files
        run: stylua .

      - name: Check formatting
        run: stylua --check .
